body {

}
.container { max-width: 400px; width: 100%; padding-top: 40px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 {

  margin-bottom: 8px;
}
.hero p { color: rgba(255,255,255,0.6); font-size: 14px; }
.input-section {

}
.input-section label { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: block; margin-bottom: 12px; }
.input-section input, .input-section textarea {
  width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; background: rgba(255,255,255,0.06); color: #fff;

.input-section textarea { min-height: 120px; resize: vertical; }
.input-section input:focus, .input-section textarea:focus { border-color: #f5af19; }
.input-section input::placeholder, .input-section textarea::placeholder { color: rgba(255,255,255,0.3); }
.btn {
  width: 100%; padding: 16px; border: none; border-radius: 14px;

// ====== Analysis Engine ======
function analyzeSongs(songs) {
  const genres = {pop:0,rock:0,electronic:0,ballad:0,hiphop:0,folk:0,classical:0,jazz:0,rnb:0,indie:0,anime:0,kpop:0,metal:0,lofi:0,ambient:0};
  const langs = {zh:0,en:0,ja:0,ko:0,other:0};

  for (const s of songs) {
    const t = `${s.name} ${s.artist}`.toLowerCase();
    if (/(rock|摇滚|guitar|吉他|metal|金属|重型|嘶吼)/.test(t)) genres.rock++;
    else if (/(electronic|电子|edm|dj|remix|synth|合成器)/.test(t)) genres.electronic++;
    else if (/(hip|rap|说唱|trap)/.test(t)) genres.hiphop++;
    else if (/(folk|民谣|吉他弹唱|不插电|acoustic)/.test(t)) genres.folk++;
    else if (/(classical|古典|交响|piano|钢琴|orchestra|管弦)/.test(t)) genres.classical++;
    else if (/(jazz|爵士|bossa|swing)/.test(t)) genres.jazz++;
    else if (/(rnb|r&b|soul)/.test(t)) genres.rnb++;
    else if (/(anime|动漫|vocaloid|初音|二次元|ost|acg)/.test(t)) genres.anime++;
    else if (/(kpop|k-pop|韩)/.test(t)) genres.kpop++;
    else if (/(indie|独立|underground|地下|alternative)/.test(t)) genres.indie++;
    else if (/(metal|金属|heavy|thrash|death|black|core|breakdown)/.test(t)) genres.metal++;
    else if (/(lofi|lo-fi|chill|ambient|氛围|白噪音|自然|雨声|冥想)/.test(t)) genres.ambient++;
    else if (/(抒情|慢歌|情歌|ballad|伤感|emo)/.test(t)) genres.ballad++;
    else genres.pop++;

    if (/[一-鿿]/.test(s.name)) langs.zh++;
    else if (/[぀-ヿ]/.test(s.name + s.artist)) langs.ja++;
    else if (/[가-힯]/.test(s.name + s.artist)) langs.ko++;
    else if (/[a-zA-Z]/.test(s.name)) langs.en++;
    else langs.other++;
  }

  const topGenre = Object.entries(genres).sort((a,b) => b[1]-a[1])[0][0];
  const topLang = Object.entries(langs).sort((a,b) => b[1]-a[1])[0][0];
  const total = songs.length;

  const mapping = {
    folk: 'wdst', pop: 'sugar', rock: 'chug', electronic: 'cybr',
    ballad: 'emo', hiphop: 'bpm', classical: 'opus', jazz: 'vibe',
    indie: 'digr', anime: 'acgn', kpop: 'sugar', rnb: 'oaae',
    metal: 'chug', ambient: 'wave', lofi: 'zen'
  };

  const pid = mapping[topGenre] || 'wave';
  const ptype = PERSONALITY_TYPES.find(t => t.id === pid) || PERSONALITY_TYPES[0];
  const soulmates = PERSONALITY_TYPES.filter(t => t.id !== pid);
  const soulmate = soulmates[Math.floor(Math.random() * soulmates.length)];

  const langNames = {zh:'中文',en:'英文',ja:'日语',ko:'韩语',other:'多元'};
  const langPct = Math.round(langs[topLang] / total * 100);

  return {
    personality_id: pid,
    personality_name: ptype.name,
    personality_emoji: ptype.emoji,
    personality_code: ptype.code,
    music_dna: {
      main_genre: topGenre.charAt(0).toUpperCase() + topGenre.slice(1),
      era: '2020s 为主',
      language: langNames[topLang] || '多元',
      energy: (['rock','hiphop','electronic','metal'].includes(topGenre) ? '高' : ['ballad','ambient','lofi'].includes(topGenre) ? '低' : '中'),
      emotion: topGenre === 'ballad' ? '忧郁' : topGenre === 'rock' ? '热烈' : topGenre === 'electronic' ? '迷幻' : topGenre === 'pop' ? '甜蜜' : topGenre === 'classical' ? '冷静' : '多元'
    },
    analysis: ptype.vibe,
    top3_songs: songs.slice(0, 3).map(s => ({name:s.name, artist:s.artist, why:'这首最能代表你此刻的耳朵'})),
    soulmate_type: soulmate.name,
    soulmate_code: soulmate.code,
    share_text: ptype.share_text,
    fun_fact: `${langNames[topLang]}歌占了${langPct > 50 ? '七成以上' : '大多数'}，${topGenre.charAt(0).toUpperCase()+topGenre.slice(1)}是你的音乐母语`,
    song_count: songs.length
  };
}

// ====== Parse input text to songs ======
function parseTextSongs(text) {
  const songs = [];
  for (let line of text.trim().split('\n')) {
    line = line.trim().replace(/^\d+[\.\)、\s]+/, '');
    if (!line || line.length < 2) continue;
    const parts = line.split(/[—\-–·•]+/);
    if (parts.length >= 2) {
      songs.push({name: parts[0].trim(), artist: parts[1].trim(), album: ''});
    } else {
      songs.push({name: line, artist: '', album: ''});
    }
  }
  return songs;
}

// ====== Fetch from NetEase API ======
// CORS 代理（多个备用）
const CORS_PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/',
  'https://proxy.cors.sh/',
];
async function corsFetch(url, opts = {}) {
  // 先直连
  try {
    const resp = await fetch(url, opts);
    if (resp.ok) return resp;
  } catch(e) {}
  // 逐个试代理
  for (const proxy of CORS_PROXIES) {
    try {
      const resp = await fetch(proxy + encodeURIComponent(url), { ...opts, signal: AbortSignal.timeout(8000) });
      if (resp.ok) return resp;
    } catch(e) {}
  }
    // 最后试 Vercel API
  try {
    const vercelUrl = 'https://music-deploy-mocha.vercel.app/api/analyze';
    const resp = await fetch(vercelUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url}),
      signal: AbortSignal.timeout(15000)
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data.songs) return { json: () => Promise.resolve({songs: data.songs}) };
    }
  } catch(e) {}
  throw new Error('所有连接方式均失败——请切换到「粘贴歌名」，直接复制歌单里的歌曲名进来');
}

async function fetchNeteasePlaylist(url) {
  // 支持163cn.tv短链接：跟随重定向获取真实URL
  if (url.includes('163cn.tv')) {
    try {
      const r = await fetch(url, { method: 'HEAD', redirect: 'follow' });
      url = r.url;
    } catch(e) {}
  }
  const match = url.match(/(?:id=|playlist\/)(\d+)/);
  if (!match) throw new Error('无法识别网易云歌单链接');
  const playlistId = match[1];

  // Step 1: get trackIds via v6 API
  const v6Resp = await corsFetch(`https://music.163.com/api/v6/playlist/detail?id=${playlistId}&n=2000`, {
    headers: { 'Referer': 'https://music.163.com/' }
  });
  const v6Data = await v6Resp.json();
  const trackIds = v6Data?.playlist?.trackIds;
  if (!trackIds || trackIds.length === 0) throw new Error('歌单为空或无法访问');

  // Step 2: get song details for first 50
  const sampleIds = trackIds.slice(0, 50).map(t => t.id).join(',');
  const detailResp = await corsFetch(`https://music.163.com/api/song/detail?ids=%5B${sampleIds}%5D`, {
    headers: { 'Referer': 'https://music.163.com/' }
  });
  const detailData = await detailResp.json();
  const songs = (detailData.songs || []).map(s => ({
    name: s.name || '',
    artist: (s.ar || []).map(a => a.name).join(', '),
    album: s.al?.name || ''
  }));

  if (songs.length === 0) throw new Error('无法获取歌曲详情，请尝试粘贴歌名');
  return songs;
}

// ====== Main ======
async function analyze() {
  const isLinkTab = document.getElementById('tab-link').classList.contains('active');
  let input = isLinkTab ? document.getElementById('urlInput').value.trim() : document.getElementById('textInput').value.trim();
  if (!input) { showError('请先粘贴歌单链接或歌单文字'); return; }

  // Extract URL from share text
  const urlMatch = input.match(/(https?:\/\/[^\s]+(?:music\.163\.com|y\.qq\.com)[^\s]*)/i);
  const isUrl = urlMatch || /music\.163\.com|y\.qq\.com/.test(input);
  if (urlMatch) input = urlMatch[1];

  document.getElementById('resultCard').classList.remove('active');
  document.getElementById('errorMsg').classList.remove('active');
  document.getElementById('loading').classList.add('active');
  document.getElementById('analyzeBtn').disabled = true;

  try {
    let songs;

    if (isUrl && isLinkTab) {
      // Try NetEase API
      try {
        songs = await fetchNeteasePlaylist(input);
      } catch(e) {
        // Fallback: suggest text paste
        showError('链接抓取失败（可能需要从中国境内访问）。请切换到「粘贴歌名」，直接复制歌单里的歌曲名进来。');
        document.getElementById('loading').classList.remove('active');
        document.getElementById('analyzeBtn').disabled = false;
        return;
      }
    } else {
      songs = parseTextSongs(input);
    }

    if (!songs || songs.length < 3) {
      showError('至少需要 3 首歌才能分析，请粘贴更多歌曲');
      document.getElementById('loading').classList.remove('active');
      document.getElementById('analyzeBtn').disabled = false;
      return;
    }

    const result = analyzeSongs(songs.slice(0, 50));
    renderResult(result);
  } catch(e) {
    showError('分析失败：' + e.message + '。请尝试粘贴歌名。');
  } finally {
    document.getElementById('loading').classList.remove('active');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function renderResult(data) {
  const card = document.getElementById('resultCard');
  card.innerHTML = `
    <div class="result-emoji">${data.personality_emoji}</div>
    <div class="result-code">${data.personality_code} <span class="result-name-inline">${data.personality_name}</span></div>
    <div class="result-mbti">🎭 推测 MBTI：${data.music_dna?.emotion === '忧郁' ? 'INFP' : data.music_dna?.emotion === '热烈' ? 'ESTP' : data.music_dna?.emotion === '甜蜜' ? 'ESFJ' : 'INTJ'}</div>
    <div class="result-analysis">${data.analysis}</div>
    <div class="dna-grid">
      <div class="dna-item"><div class="dna-label">主要流派</div><div class="dna-value">${data.music_dna.main_genre}</div></div>
      <div class="dna-item"><div class="dna-label">语言</div><div class="dna-value">${data.music_dna.language}</div></div>
      <div class="dna-item"><div class="dna-label">能量水平</div><div class="dna-value">${data.music_dna.energy}</div></div>
      <div class="dna-item"><div class="dna-label">情绪基调</div><div class="dna-value">${data.music_dna.emotion}</div></div>
    </div>
    <div class="soulmate">💫 你的音乐灵魂伴侣：<em>${data.soulmate_code} ${data.soulmate_type}</em></div>
    <div class="top3"><div class="top3-title">🎶 代表曲目</div>
      ${data.top3_songs.map((s,i) => `
        <div class="top3-item">
          <div class="top3-rank">${i+1}</div>
          <div class="top3-info">
            <div class="top3-song">${s.name}</div>
            <div class="top3-artist">${s.artist || ''}</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="fun-fact">💡 ${data.fun_fact}</div>
    <div class="sbti-note">
      <p>🎧 从歌单里取了最近添加的 50 首</p>
      <p>下次加新歌，你可能是另一个自己</p>
      <p style="font-size:11px;opacity:0.5;">分析在浏览器内完成，不存储你的歌单数据 · 纯属娱乐 · 别太认真</p>
    </div>
    <button class="btn share-btn" onclick="share()">📤 分享结果给朋友</button>
    <button class="btn retry-btn" onclick="reset()">🔄 再测一次</button>
  `;
  card.classList.add('active');
  window._shareText = data.share_text;
  window.scrollTo({ top: card.offsetTop - 20, behavior: 'smooth' });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function share() {
  const text = window._shareText || '来测测你的音乐人格！';
  if (navigator.share) {
    navigator.share({ title: '你的音乐人格是什么？', text, url: window.location.href });
  } else {
    navigator.clipboard.writeText(text + '\n' + window.location.href).then(() => alert('已复制，去粘贴给你的朋友吧！'));
  }
}

function reset() {
  document.getElementById('resultCard').classList.remove('active');
  document.getElementById('errorMsg').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('active');
}

document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
</script>
